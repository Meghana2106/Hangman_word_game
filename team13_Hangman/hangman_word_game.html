<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hangman Word Game</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top left,#263d70,#0b1020 55%);font-family:Segoe UI,Arial,sans-serif;color:#f4f6ff}.app{width:min(940px,100%)}header{text-align:center;margin-bottom:22px}.tag{color:#9db4ff;letter-spacing:3px;font-size:12px;font-weight:bold}h1{font-size:clamp(32px,5vw,48px);margin:8px 0}.sub{color:#b4bfd8}.card{background:#151f37;border:1px solid #344568;border-radius:22px;padding:24px;box-shadow:0 20px 60px #0008}.bar,.controls,.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{background:#243454;padding:10px 15px;border-radius:30px;color:#dce5ff}.btn{border:1px solid #4a5e85;background:#293b5e;color:white;padding:10px 15px;border-radius:10px;font-weight:bold;cursor:pointer}.primary{background:#91aaff;color:#111b36;border:0}.game{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;align-items:center;margin-top:22px}.drawing{background:#101a30;border:1px solid #2d3e62;border-radius:18px;display:grid;place-items:center;min-height:290px}svg{width:100%;max-width:270px;height:260px}.g{fill:none;stroke:#91a6d2;stroke-width:7;stroke-linecap:round}.p{fill:none;stroke:#ff8197;stroke-width:5;stroke-linecap:round;opacity:0}.p.show{opacity:1}.category{text-align:center;color:#9db4ff;font-size:12px;font-weight:bold;letter-spacing:2px}.word{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:25px 0 16px}.letter{width:36px;height:46px;border-bottom:3px solid #8199d0;text-align:center;font-size:27px;font-weight:bold}.question-box{background:#202e4b;border:1px solid #40557e;border-radius:13px;padding:15px 17px;margin:17px 0 12px;text-align:left}.question-label{color:#9db4ff;font-size:11px;font-weight:800;letter-spacing:2px;margin-bottom:7px}.question{text-align:left;color:#f0f4ff;font-size:15px;line-height:1.6}.hint{text-align:center;color:#b4bfd8;min-height:22px;font-size:14px;margin:10px 0 14px}.status{text-align:center;min-height:26px;font-weight:bold;margin:12px}.win{color:#52e0b3}.lose{color:#ff8197}.keyboard{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.key{background:#293b5e;color:#fff;border:1px solid #43577e;border-radius:8px;padding:11px 0;font-weight:bold;cursor:pointer}.key:disabled{opacity:.3;cursor:default}.key.correct{background:#175346;color:#8af0d0}.key.wrong{background:#592d3d;color:#ff9eae}.footer{margin-top:20px;color:#b4bfd8;font-size:13px}.footer strong{color:white}
@media(max-width:650px){.game{grid-template-columns:1fr}.card{padding:16px}.drawing{min-height:210px}svg{height:200px}.key{padding:9px 0}}
</style></head><body><main class="app"><header><div class="tag">MINI PROJECT • INTERACTIVE GAME</div><h1>Hangman Word Game</h1><div class="sub">Guess the hidden word before the hangman is complete.</div></header>
<section class="card"><div class="bar"><div class="pill">Category: <b id="categoryLabel"></b></div><div class="controls"><button class="btn" id="hintBtn">Show hint</button><button class="btn primary" id="newBtn">↻ New Game</button></div></div>
<div class="game"><div class="drawing"><svg viewBox="0 0 250 260" aria-label="Hangman drawing"><path class="g" d="M25 238H190M60 238V25H165V48M60 65L100 25"/><circle class="p" id="p1" cx="165" cy="73" r="22"/><path class="p" id="p2" d="M165 95V160"/><path class="p" id="p3" d="M165 112L132 140"/><path class="p" id="p4" d="M165 112L198 140"/><path class="p" id="p5" d="M165 160L137 205"/><path class="p" id="p6" d="M165 160L193 205"/></svg></div>
<div><div class="category" id="categoryTitle"></div><div class="question-box"><div class="question-label">QUESTION</div><div class="question" id="question">Loading question...</div></div><div class="word" id="word"></div><div class="notice" id="revealNotice">Two letters are revealed automatically in every new game.</div><div class="hint" id="hint">Need another clue? Click Show hint.</div><div class="status" id="status" aria-live="polite"></div><div class="keyboard" id="keyboard"></div></div></div>
<div class="footer"><span>Attempts left: <strong id="attempts">6</strong> / 6</span><span>Wins: <strong id="wins">0</strong> &nbsp; Losses: <strong id="losses">0</strong></span><span>Keys: A–Z</span></div></section></main>
<script>
const bank=[
["PYTHON","Programming","Which programming language is named after the British comedy group Monty Python?","It is often used for automation, data analysis, and web development."],
["DATABASE","Technology","What do we call an organized collection of information that can be stored, searched, and updated?","SQL is commonly used to work with this."],
["KEYBOARD","Computer","Which computer input device has keys that you press to type letters and numbers?","It is usually placed in front of a computer monitor."],
["INTERNET","Technology","What worldwide network connects computers and allows people to share information?","You use it to browse websites and send email."],
["ALGORITHM","Computer Science","What is a step-by-step set of instructions used to solve a problem?","Programmers design these before or while writing code."],
["JAVASCRIPT","Programming","Which programming language is widely used to make websites interactive?","It runs in web browsers and is often abbreviated as JS."],
["ELEPHANT","Animals","Which large land animal is known for its trunk and long tusks?","It is the largest living land animal."],
["RAINBOW","Nature","What colourful arc can appear in the sky when sunlight shines through raindrops?","It is often described as having seven colours."],
["NOTEBOOK","Education","What do students commonly use to write notes during a class?","It usually contains pages bound together."],
["SATELLITE","Science","What object orbits a planet, such as the Moon orbiting Earth?","Some of these are used for GPS and communication."],
["HOSPITAL","Places","Where do people go to receive medical treatment and care?","Doctors and nurses work here."],
["CRICKET","Sports","Which bat-and-ball sport is played between two teams of eleven players?","The game can be played in T20, One Day, and Test formats."]
];
const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";let answer="",hint="",question="",category="",picked=new Set(),wrong=0,wins=0,losses=0,previous="";
const el=id=>document.getElementById(id);
function finished(){return wrong===6||[...answer].every(x=>picked.has(x))}
function start(){let options=bank.filter(x=>x[0]!==previous);let item=options[Math.floor(Math.random()*options.length)];previous=item[0];[answer,category,question,hint]=item;const uniqueLetters=[...new Set(answer)];const shuffled=[...uniqueLetters].sort(()=>Math.random()-0.5);const revealed=shuffled.slice(0,Math.min(2,shuffled.length));picked=new Set(revealed);wrong=0;el("question").textContent=question;el("hint").textContent="Need another clue? Click Show hint.";el("hintBtn").disabled=false;el("revealNotice").textContent=`${revealed.length} letters revealed automatically: ${revealed.join(", ")}`;render()}
function guess(ch){if(finished()||picked.has(ch))return;picked.add(ch);if(!answer.includes(ch))wrong++;if(wrong===6)losses++;else if([...answer].every(x=>picked.has(x)))wins++;render()}
function render(){el("categoryLabel").textContent=category;el("categoryTitle").textContent=category.toUpperCase()+" • GUESS THE WORD";el("attempts").textContent=6-wrong;el("wins").textContent=wins;el("losses").textContent=losses;el("word").innerHTML=[...answer].map(c=>`<span class="letter">${picked.has(c)||wrong===6?c:""}</span>`).join("");el("keyboard").innerHTML=[...letters].map(c=>`<button class="key ${picked.has(c)?(answer.includes(c)?"correct":"wrong"):""}" data-key="${c}" ${picked.has(c)||finished()?"disabled":""}>${c}</button>`).join("");for(let i=1;i<=6;i++)el("p"+i).classList.toggle("show",wrong>=i);let s=el("status");s.className="status";if(wrong===6){s.textContent="Game over! The word was "+answer+".";s.classList.add("lose")}else if([...answer].every(x=>picked.has(x))){s.textContent="Excellent! You guessed the word.";s.classList.add("win")}else s.textContent=""}
el("keyboard").addEventListener("click",e=>{let b=e.target.closest("[data-key]");if(b)guess(b.dataset.key)});document.addEventListener("keydown",e=>{let c=e.key.toUpperCase();if(letters.includes(c))guess(c)});el("newBtn").onclick=start;el("hintBtn").onclick=()=>{el("hint").textContent="Extra hint: "+hint;el("hintBtn").disabled=true};start();
</script></body></html>
